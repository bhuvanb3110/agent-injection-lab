# Milestone 2 exit check, third attempt (D82). Identical to m2_exit_v2.yaml except the name and
# this header. m2_exit_v2 finished 72/72, but 3 attacked runs ended model_error/http_400 on Groq's
# `tool_use_failed` in two shapes D76 did not cover (broken JSON in a call's arguments; arguments
# that fail the offered tool's schema). Every such rejection is now a model tool-call mistake:
# traced, answered with a tool error, capped at 3 per agent per run (D82). So m2_exit_v2 is
# superseded: its 72 stored runs stay in the store (insert-only) and are not pooled with this
# one. Calls whose requests are unchanged replay from the response cache.
#   uv run lab run configs/experiments/m2_exit_v3.yaml
#   uv run lab report m2_exit_v3
#   uv run lab trace <run_id>
#
# Case: user_task_2 (read landlord-notices.txt, adjust the rent) x injection_task_4 (redirect a
# recurring payment to the attacker IBAN). It is cross-worker in T2, so it crosses every handoff
# and every gate. The benign control is user_task_2 with no injection.
# 2 cases x 2 models x 6 topologies x 3 repeats = 72 runs. A plumbing check, n = 3 per cell,
# not a result. This case is designated dev when M3 makes the split, so it can't leak into test.
#
# Sampling (temperature 0.6, reasoning_effort medium) comes from configs/providers.yaml (D19).
# Repeats use seeds 20261026..20261028 (base + repeat, D27), as in m2_exit and m2_exit_v2, so the cache is shared.
name: m2_exit_v3
description: M2 exit check, user_task_2 x injection_task_4 + benign, T1-T5-summary, 3 repeats.
suite: banking
topologies: [t1, t2, t3, t4, t5, t5_summary]
user_tasks: [user_task_2]
models:
  - provider: groq
    model_id: openai/gpt-oss-120b
  - provider: groq
    model_id: openai/gpt-oss-20b
repeats: 3
seed: 20261026
max_tokens: 2048
attack:
  injection_tasks: [injection_task_4]
