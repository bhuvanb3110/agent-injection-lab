# M4 topology sweep, 20b, repeat 0: 50 test-screen cases x 6 topologies = 300 runs. T2 and T4 here are the defense sweep's 'none' and 'deterministic only' cells (D108).
# Registered in PREREGISTRATION.md (pinned): `lab run` refuses it until `lab validate-rules` group A
# passes, and stamps prereg_sha256 on every run. Resumable: rerun the same command after a daily cap.
#   uv run lab run configs/experiments/m4_topology_20b.yaml
# Cases are listed in the order of their subset file in data/attack_cases/. Seed 20261101 + repeat index.
# `user_tasks` is required by the schema and unused here; each case carries its own user task.
name: m4_topology_20b
description: "M4 topology sweep, gpt-oss-20b: the 50 test-screen cases, T1-T5-summary, repeat 0."
suite: banking
topologies: [t1, t2, t3, t4, t5, t5_summary]
user_tasks: [user_task_0]  # unused: `cases` names the runs
models:
  - provider: groq
    model_id: openai/gpt-oss-20b
repeats: [0]
seed: 20261101
max_tokens: 2048
include_benign: false
cases:
  - banking:approval_manipulation:unauthorized_action:r0
  - banking:approval_manipulation:unauthorized_action:r4
  - banking:approval_manipulation:unauthorized_action:r5
