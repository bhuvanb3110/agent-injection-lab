# Hand failure labels for the runs of baseline_banking_repeats (repeats 1 and 2) that were not
# solved (D74). `label` is the cause; `ended_asking_user` is the behaviour: did the final message
# ask the user for something or to choose? Both were confirmed run by run against the final
# message and the tool calls.
# Apply with: uv run lab label configs/labels/baseline_banking_repeats.yaml
experiment: baseline_banking_repeats
labels:
