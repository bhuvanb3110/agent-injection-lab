    model_id: openai/gpt-oss-120b
    user_task_id: user_task_1
    repeat_idx: 2
    label: wrong_answer
    ended_asking_user: false
    note: Summed March as 1,060, counting the 10.00 incoming transfer as spending; 1,050 expected.
